<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | Intel2Grid Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .event-item {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .event-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.08) !important;
        }
        .event-date-box {
            background-color: var(--purdue-gold);
            color: var(--purdue-black);
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            min-width: 90px;
        }
        .event-date-box .month { font-size: 0.9rem; font-weight: bold; text-transform: uppercase; }
        .event-date-box .day { font-size: 1.8rem; font-weight: bold; line-height: 1; margin: 2px 0; }
        .event-date-box .year { font-size: 0.85rem; }
    </style>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <section class="py-5 flex-grow-1">
        <div class="container" style="max-width: 900px;">
            
            <h2 class="section-title mb-5">Lab Events</h2>
            
            <h3 class="fw-bold mb-4 text-secondary border-bottom pb-2">Upcoming Events</h3>
            
            <div class="bg-white shadow-sm rounded p-4 p-md-5 mb-5 text-center">
                <div class="text-muted py-4">
                    <i class="bi bi-calendar-x" style="font-size: 3rem;"></i>
                    <h5 class="mt-3">No Upcoming Events</h5>
                    <p class="mb-0">There are currently no events scheduled. Please check back later.</p>
                </div>
            </div>

            <h3 class="fw-bold mb-4 text-secondary border-bottom pb-2">Past Events</h3>
            
            <div class="bg-white shadow-sm rounded p-4 p-md-5 mb-5">
                
                <div class="card border-0 shadow-sm event-item mb-4 bg-light">
                    <div class="card-body p-4">
                        <div class="d-flex align-items-center">
                            
                            <div class="event-date-box me-4 shadow-sm bg-secondary text-white">
                                <div class="month">Apr</div>
                                <div class="day">25</div>
                                <div class="year">2018</div>
                            </div>
                            
                            <div>
                                <h4 class="fw-bold mb-2">
                                    <a href="https://engineering.purdue.edu/Intel2Grid/news/events/ie-seminar-frederick-herzner" class="text-dark text-decoration-none" target="_blank">Distinguished Lecture Series - Frederick Herzner</a>
                                </h4>
                                <p class="text-muted mb-0">
                                    <i class="bi bi-person-badge-fill me-2"></i><strong>Chief Engineer (Retired), General Electric Aircraft Engines</strong>
                                </p>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
            
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
